<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="hisaboGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#185CFF" />
      <stop offset="50%" stop-color="#1552E6" />
      <stop offset="100%" stop-color="#0D40C9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#hisaboGrad)" />
  
  <!-- Stylized Hisabo 'H' & Ledger Invariant Symbol -->
  <g filter="url(#shadow)" fill="#FFFFFF">
    <!-- Left Vertical Pillar -->
    <rect x="120" y="128" width="56" height="256" rx="28" />
    <!-- Right Vertical Pillar -->
    <rect x="336" y="128" width="56" height="256" rx="28" />
    <!-- Central Bridge -->
    <rect x="148" y="228" width="216" height="56" rx="28" />
    <!-- Accent Balance Dot -->
    <circle cx="256" cy="156" r="20" fill="#60A5FA" />
  </g>
</svg>
